version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse_care_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/campuscare_dev.db:/app/campuscare_dev.db

  frontend:
    build:
      context: ./Code/frontend
      dockerfile: Dockerfile
    container_name: pulse_care_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
